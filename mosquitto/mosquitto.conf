listener 1883

# Solo para la demo. En produccion: usuario/clave o certificados, TLS en el puerto 8883 y ACL por topico.
allow_anonymous true

# Guarda los mensajes QoS 1/2 encolados para sesiones persistentes.
persistence true
persistence_location /mosquitto/data/

# "all" imprime cada paquete de control (PUBLISH, PUBACK, PUBREC, PUBREL, PUBCOMP): es la evidencia de QoS.
log_dest stdout
log_type all
connection_messages true
